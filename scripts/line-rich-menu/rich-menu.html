<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>LINE Rich Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;700&display=block" rel="stylesheet">
<style>
  /* Canvas is exactly the LINE large rich menu (2500 x 1686).
     Column/row sizes match the touch areas in ../line-rich-menu-config.json,
     so every card sits inside its own tap target. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 800px at 0% 0%, rgba(56, 189, 248, 0.18), transparent 60%),
      radial-gradient(1100px 900px at 100% 100%, rgba(129, 140, 248, 0.20), transparent 60%),
      linear-gradient(160deg, #0b1a3a 0%, #0a1430 55%, #070e24 100%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px);
    background-size: 84px 84px;
    mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 85%);
  }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: 833px 834px 833px;
    grid-template-rows: 843px 843px;
    width: 2500px; height: 1686px;
  }
  .cell { padding: 26px; }
  .card {
    position: relative;
    height: 100%;
    border-radius: 64px;
    background: linear-gradient(170deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
    border: 3px solid rgba(255, 255, 255, 0.12);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.08), 0 30px 60px rgba(0, 0, 0, 0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; width: 760px; height: 760px; top: -330px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, var(--glow), transparent 65%);
    opacity: 0.55;
  }
  .num {
    position: absolute; top: 44px; right: 56px;
    font-size: 54px; font-weight: 700; letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.16);
  }
  .icon {
    position: relative;
    width: 270px; height: 270px; border-radius: 76px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    box-shadow: 0 28px 60px var(--shadow), inset 0 4px 0 rgba(255, 255, 255, 0.35);
    margin-bottom: 64px;
  }
  .icon svg {
    width: 150px; height: 150px;
    fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  .label {
    position: relative;
    font-size: 100px; font-weight: 700; line-height: 1.25; letter-spacing: -0.5px;
    text-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    white-space: nowrap;
  }
  .sub {
    position: relative;
    margin-top: 14px;
    font-size: 58px; font-weight: 500;
    color: rgba(226, 232, 240, 0.78);
    white-space: nowrap;
  }
  .blue    { --c1: #38bdf8; --c2: #2563eb; --glow: rgba(56, 189, 248, 0.45);  --shadow: rgba(37, 99, 235, 0.55); }
  .violet  { --c1: #a78bfa; --c2: #6d28d9; --glow: rgba(167, 139, 250, 0.45); --shadow: rgba(109, 40, 217, 0.55); }
  .amber   { --c1: #fbbf24; --c2: #ea580c; --glow: rgba(251, 191, 36, 0.40);  --shadow: rgba(234, 88, 12, 0.55); }
  .emerald { --c1: #34d399; --c2: #059669; --glow: rgba(52, 211, 153, 0.40);  --shadow: rgba(5, 150, 105, 0.55); }
  .teal    { --c1: #5eead4; --c2: #0e7490; --glow: rgba(94, 234, 212, 0.38);  --shadow: rgba(14, 116, 144, 0.55); }
  .rose    { --c1: #fb7185; --c2: #be123c; --glow: rgba(251, 113, 133, 0.40); --shadow: rgba(190, 18, 60, 0.55); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="card blue">
      <span class="num">01</span>
      <div class="icon"><svg viewBox="0 0 24 24"><ellipse cx="10" cy="5" rx="7" ry="2.6"/><path d="M3 5v12c0 1.4 3.1 2.6 7 2.6"/><path d="M3 11c0 1.4 3.1 2.6 7 2.6 1 0 2-.1 2.9-.2"/><path d="M17 5v5"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M17.5 19.5v-4"/><path d="m15.8 17.2 1.7-1.7 1.7 1.7"/></svg></div>
      <div class="label">นำเข้าข้อมูล</div>
      <div class="sub">สรุปผลการนำเข้ารายวัน</div>
    </div></div>

    <div class="cell"><div class="card violet">
      <span class="num">02</span>
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7.5 16v-3"/><path d="M12 16V9"/><path d="M16.5 16v-5"/><path d="m7 9 4-4 3 3 5-5"/></svg></div>
      <div class="label">ดูรายงาน</div>
      <div class="sub">แดชบอร์ดบนเว็บ</div>
    </div></div>

    <div class="cell"><div class="card amber">
      <span class="num">03</span>
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 10.5v4"/><path d="M12 17.8h.01"/></svg></div>
      <div class="label">ตรวจสอบลูกหนี้</div>
      <div class="sub">ลูกหนี้ UC ค้างปิดสิทธิ์</div>
    </div></div>

    <div class="cell"><div class="card emerald">
      <span class="num">04</span>
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <div class="label">Authen Code</div>
      <div class="sub">ยอดขอ Authen จาก สปสช.</div>
    </div></div>

    <div class="cell"><div class="card teal">
      <span class="num">05</span>
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></div>
      <div class="label">คู่มือใช้งาน</div>
      <div class="sub">วิธีใช้แต่ละเมนู</div>
    </div></div>

    <div class="cell"><div class="card rose">
      <span class="num">06</span>
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg></div>
      <div class="label">ติดต่อผู้ดูแล</div>
      <div class="sub">แจ้งปัญหา / สอบถาม</div>
    </div></div>
  </div>
</body>
</html>
